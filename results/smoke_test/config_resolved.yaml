data:
  loader:
    batch_size: 4
    num_workers: 0
  test:
  - name: test_dummy
    root: data/dummy/test
  train:
    augment: true
    max_images: null
    name: image_folder
    patch_size: 48
    repeat: 2
    root: data/dummy/train
  val:
    max_images: null
    name: image_folder
    root: data/dummy/val
degradation:
- name: bicubic_downscale
