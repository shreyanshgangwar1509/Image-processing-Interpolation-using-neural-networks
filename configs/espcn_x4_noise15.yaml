_base_: _base_x4.yaml
experiment_name: espcn_x4_noise15

degradation:
  - name: bicubic_downscale
  - name: gaussian_noise
    sigma: 15

model:
  name: espcn
  params:
    n1: 64
    n2: 32
    activation: tanh

loss: {name: l1}
optimizer: {name: adam, lr: 0.001}
scheduler: {name: none}

training:
  epochs: 100
  val_every: 5
  amp: false
  grad_clip: null
