_base_: _base_x4.yaml
experiment_name: edsr_lite_x4_clean

data:
  loader:
    batch_size: 16
    num_workers: 2

model:
  name: edsr_lite
  params:
    n_feats: 32
    n_resblocks: 8
    res_scale: 0.1

loss: {name: l1}
optimizer: {name: adam, lr: 0.0002}
scheduler: {name: step, step_size: 40, gamma: 0.5}

training:
  epochs: 100
  val_every: 5
  amp: false
  grad_clip: null
